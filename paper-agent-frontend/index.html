<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171717'/%3E%3Cpath d='M18 18h20a8 8 0 0 1 8 8v16H28L18 52V18z' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Paper Agent · 科研智能伙伴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
    <style>
      body[data-pa-view="discovery"] .page-content-narrow > .surface.flex.flex-col {
        min-height: 268px;
        padding-bottom: 92px !important;
      }

      body[data-pa-view="discovery"] .page-content-narrow > .surface .grid.w-full.max-w-lg {
        gap: 12px;
        margin-top: 20px;
        margin-bottom: 12px;
      }

      body[data-pa-view="discovery"] .page-content-narrow > .surface .quick-chip {
        border-color: color-mix(in oklab, var(--color-border), transparent 45%);
        border-radius: 14px;
        padding: 12px 18px;
      }

      body[data-pa-view="writing"] .page-content > .grid {
        gap: 24px !important;
      }

      body[data-pa-view="writing"] .page-content > .grid .surface {
        border-color: color-mix(in oklab, var(--color-border), transparent 48%);
        border-radius: 18px;
        background: color-mix(in oklab, var(--surface, var(--color-paper)) 82%, transparent);
        box-shadow: 0 10px 28px color-mix(in oklab, var(--color-ink) 7%, transparent);
      }

      body[data-pa-view="writing"] .page-content > .grid section.surface {
        padding: 20px !important;
      }

      body[data-pa-view="writing"] .page-content > .grid .surface .rounded-lg.border,
      body[data-pa-view="writing"] .page-content > .grid .surface .rounded-\[var\(--radius-sm\)\].border {
        border-color: color-mix(in oklab, var(--color-border), transparent 52%);
        border-radius: 14px;
        padding: 14px !important;
      }

      body[data-pa-view="writing"] .page-content > .grid .control {
        border-color: color-mix(in oklab, var(--color-border), transparent 50%);
        border-radius: 14px;
        background: color-mix(in oklab, var(--surface, var(--color-paper)) 86%, transparent);
        padding-inline: 16px !important;
      }

      body[data-pa-view="writing"] .page-content > .grid textarea.control {
        padding: 14px 16px !important;
      }

      body[data-pa-view="writing"] .page-content > .grid .surface p {
        line-height: 1.55;
      }
    </style>
    <script>
      (() => {
        const textReplacements = new Map([
          ["基于本地文献证据生成综述大纲、草稿、参考文献和 Markdown/LaTeX 导出。", "基于本地文献生成大纲、草稿和导出。"],
          ["先确定主题和格式，再生成大纲或草稿。", "设定主题与格式。"],
          ["选择写作时可使用的本地 READY 文献。", "选择可引用的本地文献。"],
          ["大纲和草稿都可以继续编辑，导出时会使用当前文本。", "编辑当前大纲与草稿。"],
          ["草稿中的来源编号对应这些本地文献片段。", "查看引用依据。"],
          ["生成大纲或草稿后，这里会显示证据片段。", "生成后显示证据片段。"],
          ["复制 Markdown 或 LaTeX 后可继续整理。", "复制导出文本。"],
          ["生成后会自动列出参考文献。", "生成后列出参考文献。"],
          ["还没有可用于写作的 READY 文献，请先上传并完成解析。", "暂无可用文献，请先上传并解析。"]
        ]);

        const blockReplacements = new Map([
          ["在左侧填写综述主题和格式，然后点击「生成大纲」开始写作。大纲生成后可继续生成草稿和参考文献。", "填写主题后生成大纲，再继续生成草稿。"]
        ]);

        const applyLocalTweaks = () => {
          const root = document.getElementById("root");
          if (!root) return;

          const title = root.querySelector("h1")?.textContent?.trim();
          document.body.dataset.paView =
            title === "写作工作台" ? "writing" :
            title === "论文检索" ? "discovery" : "";

          root.querySelectorAll("p, span").forEach((element) => {
            const text = element.textContent?.trim();
            if (text && blockReplacements.has(text)) {
              element.textContent = blockReplacements.get(text);
            }
          });

          const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
          const updates = [];
          let node = walker.nextNode();
          while (node) {
            const text = node.nodeValue?.trim();
            if (text && textReplacements.has(text)) {
              updates.push([node, textReplacements.get(text)]);
            }
            node = walker.nextNode();
          }
          updates.forEach(([textNode, value]) => {
            textNode.nodeValue = value;
          });
        };

        let isObserving = false;
        const observeRoot = () => {
          const root = document.getElementById("root");
          if (root && !isObserving) {
            new MutationObserver(applyLocalTweaks).observe(root, {
              childList: true,
              subtree: true,
              characterData: true
            });
            isObserving = true;
          }
          applyLocalTweaks();
        };

        window.addEventListener("DOMContentLoaded", observeRoot);
        requestAnimationFrame(observeRoot);
        setTimeout(observeRoot, 0);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

spring:
  datasource:
    url: jdbc:h2:mem:paperagent;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  ai:
    openai:
      base-url: https://ws-iz5m88fbyi75pscd.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:test-key}
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
